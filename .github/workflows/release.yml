name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Build app
        run: ANNEX_APP_PATH="$PWD/Annex.app" ./build.sh
      - name: Zip app
        run: ditto -c -k --keepParent "Annex.app" "Annex-${GITHUB_REF_NAME}.zip"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: Annex-*.zip
          generate_release_notes: true
